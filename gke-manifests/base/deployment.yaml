apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-app
  labels:
    app: sample-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sample-app
  template:
    metadata:
      labels:
        app: sample-app
      annotations:
        # Prevents GKE Autopilot's bin-packing optimizer from evicting this pod
        # for routine node consolidation. Without this, a node swap can strand
        # a PersistentVolume mid-detach and cause an avoidable outage.
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
    spec:
      containers:
        - name: sample-app
          image: us-central1-docker.pkg.dev/my-gcp-project/my-registry/sample-app:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: sample-app-config
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 20

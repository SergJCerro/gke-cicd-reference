apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: prod
resources:
  - ../../base
  - ingress.yaml
  - hpa.yaml

images:
  - name: us-central1-docker.pkg.dev/my-gcp-project/my-registry/sample-app
    newTag: v1.0.0 # updated by Cloud Deploy promotion after manual approval

patches:
  - target:
      kind: Deployment
      name: sample-app
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 250m
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "1"

name: Build

on:
  push:
    paths:
      - 'app/**'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'app/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -B -f app/pom.xml clean package

      - name: Build container image (no push)
        run: docker build -f app/Dockerfile -t sample-app:ci app
